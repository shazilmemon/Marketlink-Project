<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="meatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="steakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="50%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="fatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#FCA5A5"/>
    </linearGradient>
    <filter id="shadowMeat" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Slate Background -->
  <rect width="800" height="600" fill="url(#meatBg)"/>

  <!-- Wooden Cutting Board -->
  <g filter="url(#shadowMeat)">
    <rect x="120" y="140" width="560" height="360" rx="28" fill="#451A03" stroke="#78350F" stroke-width="4"/>
    <rect x="140" y="160" width="520" height="320" rx="20" fill="#78350F" opacity="0.4"/>

    <!-- Wood Grain lines -->
    <line x1="140" y1="220" x2="660" y2="220" stroke="#451A03" stroke-width="2" opacity="0.3"/>
    <line x1="140" y1="300" x2="660" y2="300" stroke="#451A03" stroke-width="2" opacity="0.3"/>
    <line x1="140" y1="380" x2="660" y2="380" stroke="#451A03" stroke-width="2" opacity="0.3"/>

    <!-- Ribeye Steak -->
    <g transform="translate(200, 190)" filter="url(#shadowMeat)">
      <!-- Main Cut -->
      <path d="M40 80 C80 20, 260 10, 320 70 C370 120, 360 220, 280 250 C200 280, 80 270, 30 210 C-10 160, 0 120, 40 80 Z" fill="url(#steakGrad)" stroke="#450A0A" stroke-width="4"/>

      <!-- Fat Cap / Marbling -->
      <path d="M40 80 C80 20, 260 10, 320 70 C340 90, 320 80, 270 40 C210 20, 90 30, 40 80 Z" fill="url(#fatGrad)"/>

      <!-- Internal Marbling -->
      <path d="M100 130 Q160 100 220 150 Q180 180 100 130 Z" fill="#FCA5A5" opacity="0.5"/>
      <path d="M150 190 Q220 180 260 220" stroke="#FCA5A5" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>

      <!-- T-Bone Accent -->
      <path d="M70 160 Q180 140 280 130" stroke="#FEF2F2" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9"/>
    </g>

    <!-- Rosemary Sprig -->
    <g transform="translate(480, 340) rotate(-35)">
      <line x1="0" y1="0" x2="160" y2="0" stroke="#15803D" stroke-width="4"/>
      <!-- Leaves -->
      <line x1="20" y1="0" x2="10" y2="-18" stroke="#166534" stroke-width="3"/>
      <line x1="40" y1="0" x2="30" y2="-20" stroke="#166534" stroke-width="3"/>
      <line x1="60" y1="0" x2="50" y2="-22" stroke="#166534" stroke-width="3"/>
      <line x1="80" y1="0" x2="70" y2="-20" stroke="#166534" stroke-width="3"/>
      <line x1="100" y1="0" x2="90" y2="-18" stroke="#166534" stroke-width="3"/>

      <line x1="20" y1="0" x2="10" y2="18" stroke="#166534" stroke-width="3"/>
      <line x1="40" y1="0" x2="30" y2="20" stroke="#166534" stroke-width="3"/>
      <line x1="60" y1="0" x2="50" y2="22" stroke="#166534" stroke-width="3"/>
      <line x1="80" y1="0" x2="70" y2="20" stroke="#166534" stroke-width="3"/>
    </g>

    <!-- Coarse Salt & Pepper Grains -->
    <circle cx="240" cy="220" r="3" fill="#FFFFFF"/>
    <circle cx="260" cy="250" r="2" fill="#FFFFFF"/>
    <circle cx="340" cy="280" r="3" fill="#FFFFFF"/>
    <circle cx="380" cy="230" r="2.5" fill="#374151"/>
    <circle cx="410" cy="270" r="2" fill="#374151"/>
  </g>

  <!-- Label Badge -->
  <rect x="50" y="480" width="220" height="60" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="160" y="510" text-anchor="middle" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="bold">FARM FRESH MEAT</text>
  <text x="160" y="528" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="12">Ethically Raised Cuts</text>
</svg>

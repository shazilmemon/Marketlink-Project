<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="honeyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="jarGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="30%" stop-color="rgba(251,191,36,0.3)"/>
      <stop offset="70%" stop-color="rgba(217,119,6,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.6)"/>
    </linearGradient>
    <linearGradient id="honeyLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350F" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#honeyBg)"/>

  <!-- Honeycomb Pattern in background -->
  <g opacity="0.12" stroke="#78350F" stroke-width="2" fill="none">
    <path d="M100 80 l30 -17 l30 17 v35 l-30 17 l-30 -17 z" />
    <path d="M160 80 l30 -17 l30 17 v35 l-30 17 l-30 -17 z" />
    <path d="M130 132 l30 -17 l30 17 v35 l-30 17 l-30 -17 z" />
    <path d="M700 400 l30 -17 l30 17 v35 l-30 17 l-30 -17 z" />
    <path d="M640 452 l30 -17 l30 17 v35 l-30 17 l-30 -17 z" />
    <path d="M700 504 l30 -17 l30 17 v35 l-30 17 l-30 -17 z" />
  </g>

  <!-- Table Surface -->
  <ellipse cx="400" cy="540" rx="350" ry="60" fill="#B45309" opacity="0.2"/>

  <!-- Honey Jar -->
  <g filter="url(#shadow)">
    <!-- Jar Shadow -->
    <ellipse cx="400" cy="485" rx="130" ry="25" fill="#78350F" opacity="0.3"/>

    <!-- Honey Fill -->
    <rect x="290" y="240" width="220" height="220" rx="40" fill="url(#honeyLiquid)"/>
    <ellipse cx="400" cy="240" rx="110" ry="20" fill="#FBBF24"/>

    <!-- Jar Glass Outline -->
    <rect x="280" y="210" width="240" height="260" rx="45" fill="url(#jarGlass)" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Jar Lid -->
    <path d="M320 190 h160 v25 fill='#92400E' stroke='#78350F' stroke-width='2' rx='6'"/>
    <rect x="310" y="170" width="180" height="25" rx="8" fill="#B45309" stroke="#78350F" stroke-width="2"/>
    <rect x="300" y="165" width="200" height="12" rx="4" fill="#D97706"/>

    <!-- Label -->
    <rect x="315" y="290" width="170" height="110" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="400" y="330" text-anchor="middle" fill="#78350F" font-family="sans-serif" font-size="20" font-weight="bold">RAW HONEY</text>
    <text x="400" y="355" text-anchor="middle" fill="#92400E" font-family="sans-serif" font-size="13">100% Pure &amp; Organic</text>
    <path d="M360 375 h80" stroke="#F59E0B" stroke-width="2"/>
    <text x="400" y="390" text-anchor="middle" fill="#B45309" font-family="sans-serif" font-size="11" font-weight="600">FARM PRESERVES</text>
  </g>

  <!-- Honey Dipper -->
  <g transform="translate(520, 220) rotate(25)" filter="url(#shadow)">
    <rect x="-10" y="0" width="20" height="240" rx="10" fill="#D97706"/>
    <ellipse cx="0" cy="20" rx="30" ry="40" fill="#B45309"/>
    <!-- Dipper Rings -->
    <line x1="-30" y1="5" x2="30" y2="5" stroke="#78350F" stroke-width="5"/>
    <line x1="-32" y1="20" x2="32" y2="20" stroke="#78350F" stroke-width="5"/>
    <line x1="-30" y1="35" x2="30" y2="35" stroke="#78350F" stroke-width="5"/>
    <!-- Dripping Honey -->
    <path d="M-8 40 Q0 80 5 60 Q10 100 0 110 Q-10 100 -8 40 Z" fill="#FBBF24"/>
  </g>
</svg>
